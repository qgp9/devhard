[tools]
python = "3.13.16"

[env]
PYTHONPATH = "{{config_root}}/src"

[tasks.devhard]
description = "Run the development CLI"
run = "python -m devhard"

[tasks.test]
description = "Run unit and process integration tests"
run = "python -m unittest discover -s tests -v"

[tasks.fixture]
description = "Manage disposable Docker SSH and HTTP endpoints (up/check/probe/down/status)"
run = "python experiments/docker_fixture.py"
