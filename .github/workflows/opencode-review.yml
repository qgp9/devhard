name: opencode-review

# Reviews a pull request when it is opened, reopened or marked ready for review, and again on every push to its branch,
# and posts the review as a comment. A push while a review is running cancels that review and starts a new one,
# so push in response to a review rather than before it has finished. A review that is almost done when it is
# cancelled can still post its comment, so each comment ends with the commit it reviewed.
# The primary (free) model is tried first; if that step fails for any reason, the same review is run with the
# fallback model. Reviews only post comments, so running one a second time is safe.
# Pull requests from forks and drafts are skipped: forks get no secrets, so the review could not run.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    env:
      # Models come from repository variables (Settings > Secrets and variables > Actions > Variables), so they can be
      # changed without a commit. The text after || is the default used when the variable is not set.
      PRIMARY_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      FALLBACK_MODEL: ${{ vars.OPENCODE_REVIEW_FALLBACK_MODEL || 'opencode-go/glm-5.3-flash' }}
      REVIEW_PROMPT: |
        Review this pull request. Be brief. Cover code quality, potential bugs, and one possible improvement.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Review (primary model)
        id: primary
        continue-on-error: true
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest tag, 2026-03-25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ env.PRIMARY_MODEL }}
          share: false
          prompt: |
            ${{ env.REVIEW_PROMPT }}
            End your comment with these two exact lines:
            `Commit: ${{ github.event.pull_request.head.sha }}`
            `Model: ${{ env.PRIMARY_MODEL }}`

      # continue-on-error hides a failed primary step (the run stays green), so leave a visible trace.
      # A step killed by a timeout posts no comment at all, so this may be the only trace.
      - name: Note that the fallback is used
        if: steps.primary.outcome != 'success'
        run: |
          echo "::warning title=opencode fallback::The primary model ${PRIMARY_MODEL} failed (step outcome: ${{ steps.primary.outcome }}); this review used ${FALLBACK_MODEL}. See the 'Review (primary model)' step log."
          echo "### opencode fallback used" >> "$GITHUB_STEP_SUMMARY"
          echo "Primary \`${PRIMARY_MODEL}\` failed (${{ steps.primary.outcome }}); reviewed with \`${FALLBACK_MODEL}\`. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Review (fallback model)
        if: steps.primary.outcome != 'success'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest tag, 2026-03-25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ env.FALLBACK_MODEL }}
          share: false
          prompt: |
            ${{ env.REVIEW_PROMPT }}
            End your comment with these two exact lines:
            `Commit: ${{ github.event.pull_request.head.sha }}`
            `Model: ${{ env.FALLBACK_MODEL }}`
