name: opencode

# Ask opencode about an issue or a pull request, or let it make a change, by commenting /oc or /opencode.
# Only the owner, members and collaborators can use it: a run costs LLM calls and can push branches.
# (issue_comment workflows run from the default branch, so changes to this file take effect after they are merged.)
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest tag, 2026-03-25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # The model comes from the repository variable OPENCODE_MODEL (Settings > Secrets and variables > Actions >
          # Variables), so it can be changed without a commit. The text after || is the default.
          model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          # Do not publish the session to a public URL (the action's default is true for public repositories).
          share: false
